name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefix server --no-audit
      - run: npm audit --prefix server --audit-level moderate
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  build-server:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefix server --omit=dev
      - run: npm run build --prefix client
        env:
          VITE_API_URL: https://temptalk-xwes.onrender.com

  build-apk:
    runs-on: ubuntu-latest
    needs: build-server
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-android@v2
      - uses: maierj/npm-android-action@v1
        with:
          args: "run build --prefix client"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk